name: Apply cost-safe fallback routing

on:
  push:
    branches:
      - sage/cost-safe-fallbacks
    paths:
      - .github/workflows/apply-cost-safe-fallbacks.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sage/cost-safe-fallbacks
          fetch-depth: 0

      - name: Apply routing patch
        run: |
          python patches/apply_cost_safe_fallbacks.py
          git diff --check
          python -m py_compile src/clients/model_router.py

      - name: Commit patched model_router.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clients/model_router.py
          git commit -m "Prevent expensive fallback from cheap model routes"
          git push origin HEAD:sage/cost-safe-fallbacks
